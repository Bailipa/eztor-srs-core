<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EZTor SRS Core Demo</title>
<style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:0 20px;color:#17202a}button{font:inherit;padding:10px 16px;margin:4px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}.bad{background:#dc2626}pre{background:#f3f4f6;padding:16px;border-radius:10px;white-space:pre-wrap}</style>
<h1>EZTor SRS Core</h1><p>Try a transparent spaced-repetition schedule in your browser.</p><p>Card state: <b id="state">new</b></p><button onclick="review(true)">I remembered</button><button class="bad" onclick="review(false)">I forgot</button><pre id="out"></pre><p><a href="https://github.com/Bailipa/eztor-srs-core">View source on GitHub</a></p>
<script>let s={repetitions:0,intervalDays:0,ease:2.5,lapses:0,dueDate:null};function review(ok){let now=new Date();if(ok){s.repetitions++;s.intervalDays=[0,1,2,4,7,15][s.repetitions]||Math.min(60,Math.max(30,Math.round(s.intervalDays*s.ease)));s.dueDate=new Date(now.getTime()+s.intervalDays*864e5).toISOString()}else{s.repetitions=0;s.intervalDays=0;s.lapses++;s.ease=Math.max(1.3,s.ease-.15);s.dueDate=new Date(now.getTime()+6e5).toISOString()}document.getElementById('state').textContent=s.repetitions?'review '+s.repetitions:'relearning';document.getElementById('out').textContent=JSON.stringify(s,null,2)}review(true)</script>
